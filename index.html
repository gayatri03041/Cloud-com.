<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Small Web Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #312e81;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #facc15;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #4f46e5;
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: #16a34a;
        }

        footer {
            text-align: center;
            background: #312e81;
            color: white;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Web Page</h1>
        <p>A Simple HTML, CSS and JavaScript Website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="container">
        <div class="card" id="about">
            <h2>Hello! 👋</h2>
            <p>
                This is a small and simple web page created using
                HTML, CSS and JavaScript in a single file.
            </p>

            <button onclick="showMessage()">Click Me</button>

            <div id="message"></div>
        </div>
    </div>

    <footer id="contact">
        <p>© 2026 My Web Page | All Rights Reserved</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Thank you for visiting my website! 😊";
        }
    </script>

</body>
</html>
